# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: asiaconstructionjod-lang/-asia-construction-website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/7fbb2ce0-4a1b-4dd7-be16-7f0ac1ab7bed/pkce
  auth_token_endpoint: /sites/7fbb2ce0-4a1b-4dd7-be16-7f0ac1ab7bed/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://teal-eclair-e45f87.netlify.app

media_folder: "uploads"
public_folder: "/uploads"

locale: "ar"

collections:
  - name: "settings"
    label: "إعدادات الموقع"
    files:
      - file: "content/site.json"
        label: "معلومات عامة"
        name: "site"
        fields:
          - { label: "اللوجو", name: "logo", widget: "image" }
          - { label: "اسم الشركة (عربي)", name: "companyNameAr", widget: "string" }
          - { label: "اسم الشركة (إنجليزي)", name: "companyNameEn", widget: "string" }
          - { label: "عنوان البانر الرئيسي", name: "heroTitle", widget: "string" }
          - { label: "وصف البانر الرئيسي", name: "heroSubtitle", widget: "text" }
          - { label: "نبذة عنا", name: "aboutText", widget: "text" }
          - { label: "رقم الهاتف", name: "phone", widget: "string" }
          - { label: "البريد الإلكتروني", name: "email", widget: "string" }
          - { label: "العنوان", name: "address", widget: "text" }
          - { label: "رابط فيسبوك", name: "facebook", widget: "string", required: false }
          - { label: "رابط انستغرام", name: "instagram", widget: "string", required: false }

  - name: "projects"
    label: "أعمالنا"
    files:
      - file: "content/projects.json"
        label: "قائمة المشاريع"
        name: "projects"
        fields:
          - label: "المشاريع"
            name: "items"
            widget: "list"
            summary: "{{title}} ({{category}})"
            fields:
              - { label: "اسم المشروع", name: "title", widget: "string" }
              - label: "التصنيف"
                name: "category"
                widget: "select"
                options:
                  - { label: "داخلي", value: "interior" }
                  - { label: "معماري", value: "architectural" }
              - { label: "صورة المشروع", name: "image", widget: "image" }
              - { label: "وصف مختصر", name: "description", widget: "text", required: false }
